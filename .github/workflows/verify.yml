name: verify

# The point of these results is that they are checkable, so they are checked whenever the
# checking code or the certificates change.  If this badge is not green, do not believe the numbers.
#
# Two tiers (verify.sh): the fast tier (minutes) runs on every push and pull request touching the
# checkers, certificates or Lean (not site/, docs/, notes/, tasks/ or Markdown); the full tier (the slow sweeps) runs only when started by hand from the Actions tab, since
# re-running our own code on our own certificates is not an independent check.

on:
  push:
    paths-ignore: ['site/**', 'docs/**', 'notes/**', 'tasks/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', 'notes/**', 'tasks/**', '**.md']
  workflow_dispatch:
    inputs:
      tier:
        description: 'fast or full'
        type: choice
        options: [fast, full]
        default: fast
  schedule:
    # Monthly, fast tier only, so bit-rot in the toolchain surfaces before someone else finds it.
    - cron: '0 6 1 * *'

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tier == 'full' && 350 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            verify/target
            verify2/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('verify/Cargo.lock', 'verify2/Cargo.lock') }}

      - name: Install Python and numpy (the unavoidable-set and zero-margin checkers use it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet numpy

      - name: Check certificate hashes
        run: sha256sum -c certificates/SHA256SUMS

      - name: Verify certificates and run the rejection tests (${{ inputs.tier || 'fast' }} tier)
        env:
          S32_SEPARATE: '1'   # the s(32) full re-sweep (~5 CPU-h) is left to certificates/s32/verify.sh --full, run locally
          S21_SEPARATE: '1'   # likewise the s(21) zm_mixed.py re-sweep (~20 CPU-h); the zmx2 full run stays in CI
          S45_SEPARATE: '1'   # likewise the s(45) zm_mixed.py re-sweep (~16.5 CPU-h); the zmx2 full run stays in CI
          S60_SEPARATE: '1'   # likewise the s(60) zm_mixed.py re-sweep (~19.6 CPU-h); the zmx2 full run stays in CI
        run: ./verify.sh ${{ inputs.tier == 'full' && '--full' || '' }}

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the Lean project (Mathlib from its cache)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

      - name: No sorry anywhere a checker relies on
        working-directory: lean
        run: |
          lake env lean Axioms.lean | tee axioms.out
          ! grep -n 'sorryAx' axioms.out
