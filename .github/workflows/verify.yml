name: verify

# Spot checks, not reproductions.  On every push touching code, certificates or Lean (not site/,
# docs/, notes/, tasks/ or Markdown) and monthly: `./verify.sh --spot` (build both checkers, hashes,
# the point certificates, every bundle's shipped run records; no fresh sweeps) and a small Lean
# target (definitions, zero-margin primitives, exact forms and local minima at n = 5, 8, 11).
# The real checks run locally: `./verify.sh` (fast tier: fresh sweeps + rejection suites) after
# touching a checker or certificate, `./verify.sh --full`, and `cd lean && lake build` (several
# modules need > 16 GB, more than a hosted runner has).  The fast and full certificate tiers can
# still be started by hand from the Actions tab.

on:
  push:
    paths-ignore: ['site/**', 'docs/**', 'notes/**', 'tasks/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', 'notes/**', 'tasks/**', '**.md']
  workflow_dispatch:
    inputs:
      tier:
        description: 'spot, fast or full (certificates only; Lean is always the spot target)'
        type: choice
        options: [spot, fast, full]
        default: spot
  schedule:
    # Monthly, spot tier, so bit-rot in the toolchain surfaces before someone else finds it.
    - cron: '0 6 1 * *'

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tier == 'full' && 350 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            verify/target
            verify2/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('verify/Cargo.lock', 'verify2/Cargo.lock') }}

      - name: Install Python and numpy (the unavoidable-set and zero-margin checkers use it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet numpy

      - name: Check certificate hashes
        run: sha256sum -c certificates/SHA256SUMS

      - name: Verify certificates (${{ inputs.tier || 'spot' }} tier)
        env:
          S32_SEPARATE: '1'   # the s(32) full re-sweep (~5 CPU-h) is left to certificates/s32/verify.sh --full, run locally
          S21_SEPARATE: '1'   # likewise the s(21) zm_mixed.py re-sweep (~20 CPU-h); the zmx2 full run stays in CI
          S45_SEPARATE: '1'   # likewise the s(45) zm_mixed.py re-sweep (~16.5 CPU-h); the zmx2 full run stays in CI
          S60_SEPARATE: '1'   # likewise the s(60) zm_mixed.py re-sweep (~19.6 CPU-h); the zmx2 full run stays in CI
        run: ./verify.sh ${{ inputs.tier == 'full' && '--full' || inputs.tier == 'fast' && '--fast' || '--spot' }}

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the Lean spot target (Mathlib from its cache)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: Sqpack.Spec Sqpack.SpecFC Sqpack.ZeroMargin Sqpack.ChordLine Sqpack.Cover Sqpack.Exact.N5c Sqpack.Exact.N11c Sqpack.LocalMinCheck Sqpack.ChainLocalMin Sqpack.Exact.N8Chain Sqpack.Conjectures Sqpack.ConjecturesProofs

      - name: No sorry in the spot target (the full list, Axioms.lean, runs locally)
        working-directory: lean
        run: |
          lake env lean AxiomsSpot.lean | tee axioms.out
          ! grep -n 'sorryAx' axioms.out
