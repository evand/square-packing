# Example campaign for the event loop (format: pk/events.py docstring; design: DESIGN.md).  Real campaign files are
# pre-registrations and results; they live in a plugin's goals/ directory, found by name (`python3 -m pk.events add NAME`).
# This one uses public stages only.
goal: example
budget_cpu_h: 1
notes: >
  Local moves on non-regular packings near the best at a few n, plus add / drop from the neighbours.
predictions:                       # required: write them before running; grade them in `result`
  any_target_improves: 0.1
events:
  ns: [37, 38, 39]
  moves:
    relax: {chain: 'relax.round.05c.p5', once: true, relax: true}
    kick:  {chain: 'perturb.kick | relax.round.05c.p5'}
    add:   {chain: 'grow.add | relax.round.05c.p5', dn: 1}
    drop:  {chain: 'shrink.drop | relax.round.05c.p5', dn: -1}
  policies: [rule, uniform]
  window: 2.0e-3
  exclude: [G, D, S]
  unit_cpu: 20
